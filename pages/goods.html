<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goods</title>
    <link rel="stylesheet" href="../style/styles.css">
</head>
<body>
    <main class="page">

        <header class="header">
                <div class="container">
                    <div class="header__content">
                        <h1 class="header__title">Товары</h1>
                        <p class="header__subtitle">Скидок не будет</p>
                    </div>
                </div>
            </header>

            <nav class="nav">
                <div class="container">
                    <ul class="nav__list">
                        <li class="nav__item">
                            <a class="nav__link" href="../index.html">Главная</a>
                        </li>
                        <li class="nav__item">
                            <a class="nav__link" href="news.html">Новости</a>
                        </li>
                        <li class="nav__item">
                            <a class="nav__link" href="practices.html">Практики</a>
                        </li>
                        <li class="nav__item">
                            <a class="nav__link" href="goods.html">Товары</a>
                        </li>
                        <li class="nav__item">
                            <a class="nav__link" href="contacts.html">Контакты</a>
                        </li>
                    </ul>
                </div>
        </nav>


        <section class="goods">
            <div class="goods__grid">
                <article class="goods-card">
                    <picture>
                        <source srcset="../images/goods__pic-1.webp" type="image/webp">
                        <source srcset="../images/goods__pic-1.jpg" type="image/jpeg">
                        <img class="goods__image" loading="lazy" src="../images/goods__pic-1.jpg" alt="photo">
                    </picture>
                    <p class="goods__title">Склад вентиляторов</p>
                    <h2 class="goods__price">Цена: 100500₽</h2>
                </article>
                <article class="goods-card">
                    <picture>
                        <source srcset="../images/goods__pic-2.webp" type="image/webp">
                        <source srcset="../images/goods__pic-2.jpg" type="image/jpeg">
                        <img class="goods__image" loading="lazy" src="../images/goods__pic-2.jpg" alt="photo">
                    </picture>
                    <p class="goods__title">Гриб в майнкрафте</p>
                    <h2 class="goods__price">Цена: 10₽</h2>
                </article>
                <article class="goods-card">
                    <picture>
                        <source srcset="../images/goods__pic-3.webp" type="image/webp">
                        <source srcset="../images/goods__pic-3.jpg" type="image/jpeg">
                        <img class="goods__image" loading="lazy" src="../images/goods__pic-3.jpg" alt="photo">
                    </picture>
                    <p class="goods__title">Бизнес ланч</p>
                    <h2 class="goods__price">Цена: 160000₽ за семестр</h2>
                </article>
            </div>
        </section>

        <footer class="footer">
                <div class="container">
                    <div class="footer__content">
                        <p class="footer__copyright">&copy; 2025 StudentDev Portfolio</p>
                        <div class="footer__links">
                            <a href="https://github.com/reborn-type" class="footer__link">GitHub</a>
                        </div>
                    </div>
                </div>
        </footer>
    </main>
</body>
</html>
